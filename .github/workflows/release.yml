name: release

# From 0.2, a pushed version tag publishes to npm with provenance, over OIDC (npm trusted publishing): no npm token
# is stored anywhere. 0.1.0 is published by hand. Before the first run, the npm package must name this repository
# and this workflow file as its trusted publisher, and package.json must name this repository in `repository.url`
# (the owner adds it with the GitHub account): npm refuses a provenance publish without a matching one.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scrub gate reads `git log --all`.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci --ignore-scripts
      - name: The tag names package.json's version
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not name package.json's version ($want)"
            exit 1
          fi
      # npm refuses `--provenance` (E422) when repository.url does not name the repository this runs in. Stop here,
      # before the build, rather than at the upload.
      - name: package.json names its repository
        run: |
          url="$(node -p "const r = require('./package.json').repository; (typeof r === 'string' ? r : r?.url) ?? ''")"
          if [ -z "$url" ]; then
            echo "package.json has no repository.url, and npm refuses a --provenance publish without one that names"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY. Add, then tag again:"
            echo "  \"repository\": {\"type\": \"git\", \"url\": \"git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git\"}"
            exit 1
          fi
      # `prepublishOnly` runs typecheck, build and the scrub gate before anything is uploaded, as on a hand publish.
      - run: npm publish --provenance --access public
        env:
          REFSURE_SCRUB_PATTERNS: ${{ secrets.REFSURE_SCRUB_PATTERNS }}
          REFSURE_SCRUB_ALLOW: ${{ secrets.REFSURE_SCRUB_ALLOW }}
