<!doctype html><html lang="en"><head><meta charset="utf-8"><title>refsure hero</title><link rel="stylesheet" href="stage.css">
<style>
.label { font-size: 46px; padding: 14px 22px 11px; }
.label .meta { font-size: 30px; margin-left: 16px; }
.ramp i { width: 11px; height: 20px; }
.chalk { border-width: 3px; }
</style></head><body><div class="floor" role="img" aria-label="refsure finds the Search button on a page in a hidden Orca tab, holds the Accept all button, and does the whole step, click included, in 2.6 seconds while your screen stays put">
  <div style="position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:28px">
    <div class="mark" style="width:84px;height:104px"><i style="left:0;top:0;width:100%;height:16%;background:var(--yellow)"></i><i style="left:39%;top:16%;width:22%;height:68%;background:var(--tape)"></i><i style="left:0;top:84%;width:100%;height:16%;background:var(--red)"></i></div>
    <div class="word" style="font-size:150px">refsure</div>
  </div>

  <!-- the page on the floor: a search field and its button, a cookie banner -->
  <div class="chalk" style="left:64px;top:370px;width:520px;height:104px"></div><span class="ctl" style="left:96px;top:401px;font-size:36px;color:#ffffff8c">Search invoices</span>
  <div class="chalk" style="left:612px;top:370px;width:300px;height:104px"></div><span class="ctl" style="left:706px;top:401px;font-size:36px;color:#ffffff8c">Search</span>
  <div class="spike" style="left:590px;top:348px;width:72px;height:14px;background:var(--green)"></div>
  <div class="spike" style="left:619px;top:348px;width:14px;height:48px;background:var(--green)"></div>
  <div class="spike" style="left:884px;top:484px;width:56px;height:14px;background:var(--green)"></div>
  <div class="label" style="left:92px;top:252px;transform:rotate(-1.4deg)">@e4 Search button<span class="meta">PICKED</span><span class="ramp"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span></div>

  <div class="chalk faint" style="left:64px;top:560px;width:848px;height:180px"></div>
  <span class="ctl" style="left:96px;top:590px;font-size:34px;color:#ffffff73">We use cookies</span>
  <div class="chalk faint" style="left:460px;top:640px;width:210px;height:72px"></div><span class="ctl" style="left:496px;top:656px;font-size:32px;color:#ffffff73">Accept all</span>
  <div class="chalk faint" style="left:692px;top:640px;width:196px;height:72px"></div><span class="ctl" style="left:744px;top:656px;font-size:32px;color:#ffffff73">Reject</span>
  <div class="spike" style="left:418px;top:610px;width:66px;height:14px;background:var(--red);transform:rotate(45deg)"></div>
  <div class="spike" style="left:418px;top:610px;width:66px;height:14px;background:var(--red);transform:rotate(-45deg)"></div>
  <div class="label held" style="left:96px;top:760px;transform:rotate(1.1deg)">@e9 Accept all<span class="meta">CONSENT · HELD, NOT CLICKED</span></div>

  <!-- the cue light panel, its GO lamp's light spilling on the panel -->
  <div class="cuebox" style="left:1010px;top:64px;width:530px;height:752px;padding:52px 52px;overflow:hidden">
    <div class="spill" style="left:150px;top:-60px;width:320px;height:320px;background:radial-gradient(circle,#45d96e2e 0%,#45d96e0d 45%,transparent 70%)"></div>
    <div style="position:relative;display:flex;gap:44px"><span class="lamp" style="font-size:42px;gap:18px"><span class="dot off" style="width:48px;height:48px"></span>STBY</span><span class="lamp" style="font-size:42px;gap:18px"><span class="dot go" style="width:48px;height:48px"></span>GO</span></div>
    <div class="num" style="position:relative;font-size:200px;margin:70px 0 40px">2.6 s</div>
    <div class="cap" style="position:relative;font-size:44px;line-height:1.25;color:#cfcbc0">The whole step, click included, in a hidden Orca tab.</div>
    <div class="cap" style="position:relative;font-size:44px;line-height:1.25;margin-top:28px;color:var(--tape)">Your screen did not move.</div>
  </div>
</div></body></html>
