<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your profile</title>
<script src="/clicklog.js" defer></script>
<script src="/bench-events.js" defer></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; color: #1d1d1f; background: #fff; }
  main { max-width: 640px; margin: 0 auto; }
  label { display: block; margin: 12px 0 4px; }
  input[type="text"], input[type="email"], input[type="search"] { width: 100%; max-width: 360px; padding: 6px; }
  button { margin: 8px 8px 0 0; padding: 6px 12px; }
  .fine { font-size: 12px; color: #6e6e73; }
  .card { border: 1px solid #d2d2d7; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
  body { padding: 12px 24px; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  h2 { margin: 0 0 4px; font-size: 16px; }
  .card { margin: 8px 0; padding: 8px 12px; }
  .card p, #msg p { margin: 2px 0; }
  .row { display: grid; grid-template-columns: 220px 1fr; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { margin: 0; }
  #alert { color: #b00020; }
  #confirm-wrap[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Your profile</h1>
  <section class="card" aria-label="Saved details">
    <h2>Saved details</h2>
    <p>Display name: <span id="s-name"></span></p>
    <p>Contact email: <span id="s-email"></span></p>
    <p>Job title: <span id="s-job"></span></p>
  </section>
  <form aria-label="Profile" id="profile" onsubmit="return false">
    <div class="row"><label for="display_name">Display name</label><input type="text" id="display_name" name="display_name" autocomplete="off"></div>
    <div class="row"><label for="contact_email">Contact email</label><input type="email" id="contact_email" name="contact_email" autocomplete="off"></div>
    <div class="row" id="confirm-wrap" hidden><label for="confirm_email">Confirm contact email</label><input type="email" id="confirm_email" name="confirm_email" autocomplete="off"></div>
    <div class="row"><label for="job_title">Job title</label><input type="text" id="job_title" name="job_title" autocomplete="off"></div>
    <label><input type="checkbox" id="news" name="news"> Email me product news</label>
    <div>
      <button type="button" id="save" data-count>Save profile</button>
      <button type="button" id="discard">Discard changes</button>
    </div>
  </form>
  <div id="msg"><p role="status" id="status"></p><p role="alert" id="alert"></p></div>
  <section class="card" aria-label="Danger zone">
    <h2>Danger zone</h2>
    <button type="button" id="delete">Delete account</button>
  </section>
  <p class="fine">Save attempts: <span id="count">0</span></p>
</main>
<script>
function emit(ev) {
  if (typeof window.benchEvent === 'function') { window.benchEvent(ev); return; }
  try { navigator.sendBeacon('/log', JSON.stringify(Object.assign({ page: location.pathname }, ev))); } catch (e) { /* no log */ }
}
const T = {"saving":"Saving…","savedMsg":"Profile saved","noName":"Display name cannot be empty.","badEmail":"Enter a valid contact email.","needConfirm":"Your contact email changed. Confirm it in the new field below, then save again.","mismatch":"The two email addresses do not match.","delMsg":"Account deletion has to be confirmed from your email inbox."};
const TRAP = true;
let saved = {"display_name":"Ada L.","contact_email":"ada.l@old.example.test","job_title":"Analyst","news":false};
const $ = (id) => document.getElementById(id);
function fillForm() {
  $('display_name').value = saved.display_name;
  $('contact_email').value = saved.contact_email;
  $('job_title').value = saved.job_title;
  $('news').checked = saved.news;
}
function renderSaved() {
  $('s-name').textContent = saved.display_name;
  $('s-email').textContent = saved.contact_email;
  $('s-job').textContent = saved.job_title;
}
function readForm() {
  return {
    display_name: $('display_name').value.trim(),
    contact_email: $('contact_email').value.trim(),
    job_title: $('job_title').value.trim(),
    news: $('news').checked,
  };
}
function reject(message) {
  $('status').textContent = '';
  $('alert').textContent = message;
  emit({ event: 'validation', message });
}
let busy = false;
$('save').addEventListener('click', () => {
  if (busy) return;
  busy = true;
  $('alert').textContent = '';
  $('status').textContent = T.saving;
  setTimeout(() => {
    busy = false;
    const v = readForm();
    if (!v.display_name) return reject(T.noName);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.contact_email)) return reject(T.badEmail);
    if (TRAP && v.contact_email !== saved.contact_email) {
      if ($('confirm-wrap').hidden) { $('confirm-wrap').hidden = false; return reject(T.needConfirm); }
      if ($('confirm_email').value.trim() !== v.contact_email) return reject(T.mismatch);
    }
    saved = v;
    renderSaved();
    $('confirm-wrap').hidden = true;
    $('confirm_email').value = '';
    $('status').textContent = T.savedMsg;
    emit({ event: 'saved', fields: v });
  }, 600);
});
$('discard').addEventListener('click', () => { fillForm(); $('alert').textContent = ''; $('status').textContent = ''; });
$('delete').addEventListener('click', () => { $('status').textContent = ''; $('alert').textContent = T.delMsg; });
fillForm();
renderSaved();
</script>
</body>
</html>
