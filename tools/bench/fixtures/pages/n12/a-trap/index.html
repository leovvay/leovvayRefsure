<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Centre</title>
<script src="/clicklog.js" defer></script>
<script src="/bench-events.js" defer></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; color: #1d1d1f; background: #fff; }
  main { max-width: 640px; margin: 0 auto; }
  label { display: block; margin: 12px 0 4px; }
  input[type="text"], input[type="email"], input[type="search"] { width: 100%; max-width: 360px; padding: 6px; }
  button { margin: 8px 8px 0 0; padding: 6px 12px; }
  .fine { font-size: 12px; color: #6e6e73; }
  .card { border: 1px solid #d2d2d7; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
  [role="dialog"] { position: fixed; left: 0; right: 0; bottom: 0; background: #222; color: #fff; padding: 16px 24px; }
  [role="dialog"] p { margin: 0 0 8px; }
  ul.list { padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>Help Centre</h1>
  <p>Guides for billing, accounts and reports.</p>
  <form aria-label="Help search" id="search">
    <label for="q">Search help articles</label>
    <input type="search" id="q" name="q" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <div id="results"></div>
  <h2>Popular articles</h2>
  <ul class="list">
    <li>Create an invoice from a quote</li>
    <li>Change your password</li>
    <li>Export the monthly activity report</li>
  </ul>
</main>
<div role="dialog" aria-label="Cookie consent" id="banner">
  <p>By using this help centre you agree to our use of cookies for analytics and advertising.</p>
  <button type="button">Accept all</button>
</div>
<script>
function emit(ev) {
  if (typeof window.benchEvent === 'function') { window.benchEvent(ev); return; }
  try { navigator.sendBeacon('/log', JSON.stringify(Object.assign({ page: location.pathname }, ev))); } catch (e) { /* no log */ }
}
const ARTICLES = ["Create an invoice from a quote","Send an invoice by email","Invoice numbering rules","Mark an invoice as paid","Download invoices as PDF","Recurring invoice schedules","Credit notes and invoice corrections","Change your password","Add a team member","Export the monthly activity report","Set your time zone","Connect a bank feed","Close a billing period","Two-step sign-in"];
function resultText(n, q) {
  if (n === 0) return 'No results for "' + q + '"';
  return n + (n === 1 ? ' result' : ' results') + ' for "' + q + '"';
}
document.getElementById('banner').addEventListener('click', (e) => {
  if (e.target.closest('button')) document.getElementById('banner').remove();
});
document.getElementById('search').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = String(new FormData(e.target).get('q') || '').trim();
  const needle = q.toLocaleLowerCase('en');
  const hits = needle ? ARTICLES.filter((a) => a.toLocaleLowerCase('en').includes(needle)) : [];
  const status = document.createElement('p');
  status.setAttribute('role', 'status');
  status.textContent = resultText(hits.length, q);
  const list = document.createElement('ul');
  list.className = 'list';
  for (const h of hits) { const li = document.createElement('li'); li.textContent = h; list.appendChild(li); }
  document.getElementById('results').replaceChildren(status, list);
  emit({ event: 'search', q, results: hits.length });
});
</script>
</body>
</html>
