<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Widget</title>
<script src="/clicklog.js" defer></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
  main { max-width: 640px; margin: 0 auto; }
  #newsletter { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
  #newsletter .box { background: #fff; padding: 24px; border-radius: 8px; width: 320px; }
  #newsletter input { display: block; width: 100%; padding: 6px; margin: 12px 0; box-sizing: border-box; }
</style>
</head>
<body>
<main>
  <h1>Acme Widget</h1>
  <p><strong>$49.00</strong></p>
  <p>The Acme Widget is a compact, durable widget for everyday use. Ships in two days.</p>
  <button type="button">Add to cart</button>
</main>
<div id="newsletter" role="dialog" aria-modal="true" aria-label="Subscribe to our newsletter">
  <div class="box">
    <h2>Stay in the loop</h2>
    <p>Get product news in your inbox.</p>
    <input type="email" aria-label="Email" placeholder="you@example.test" autocomplete="off">
    <button type="button">Subscribe</button>
    <button type="button">No thanks</button>
  </div>
</div>
</body>
</html>
