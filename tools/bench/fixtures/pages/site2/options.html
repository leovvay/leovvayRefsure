<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping</title>
<script src="/clicklog.js" defer></script>
<style>body { font-family: system-ui, sans-serif; padding: 24px; } main { max-width: 480px; margin: 0 auto; } label { display: block; margin: 12px 0; }</style>
</head>
<body>
<main>
  <h1>Shipping</h1>
  <form aria-label="Shipping" onsubmit="return false">
    <label>Country
      <select aria-label="Country" name="country">
        <option value="pl">Polska</option>
        <option value="ua">Україна</option>
        <option value="de">Deutschland</option>
        <option value="es">España</option>
      </select>
    </label>
    <button type="button">Continue</button>
  </form>
</main>
</body>
</html>
