<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How booking works - Roomly</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f7f7f9; color: #1d1d24; }
  header { display: flex; gap: 18px; align-items: center; padding: 12px 24px; background: #fff; border-bottom: 1px solid #ddd; }
  header .brand { font-weight: 700; margin-right: 12px; }
  header nav a { margin-right: 14px; color: #3b4cc0; text-decoration: none; }
  main { max-width: 760px; margin: 0 auto; padding: 24px; line-height: 1.5; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border-bottom: 1px solid #e3e3e8; padding: 6px 8px; text-align: left; }
  .muted { color: #6b6b78; font-size: .92rem; }
  .card { background: #fff; border: 1px solid #e3e3e8; border-radius: 8px; padding: 14px 16px; margin: 12px 0; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; background: #eceef8; font-size: .85rem; }
  .bar { height: 8px; background: #e3e3e8; border-radius: 4px; } .bar > i { display: block; height: 8px; background: #3b4cc0; border-radius: 4px; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: #1d1d24; color: #fff; padding: 10px 14px; border-radius: 6px; }
  button { font: inherit; padding: 6px 12px; }
</style>
</head>
<body>
<header>
  <span class="brand">Roomly</span>
  <nav>
      <a href="#stays">Stays</a>
      <a href="#help">Help</a>
  </nav>
</header>
<main>
<h1>How booking works</h1>
<p>After you pay, you will see a message like this one:</p>
<div class="card muted"><p><em>Example:</em> &ldquo;Your booking at Harbour View Inn is confirmed. Check-in from 15:00.&rdquo;</p></div>
<p>If you do not see it, check the Trips page.</p>
</main>
</body>
</html>
