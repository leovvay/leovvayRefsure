<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Almadía Hogar</title>
<style>
  :root { --accent: #b5651d; --ink: #1d2329; --muted: #5d6974; --line: #dde3e8; --bg: #f5f7f9; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { background: #fff; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 12px 24px; }
  header.slim { justify-content: center; }
  .brand { font-weight: 700; color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; margin-right: 16px; }
  main { max-width: 880px; margin: 24px auto; padding: 0 16px; }
  main.bare { max-width: 520px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .muted { color: var(--muted); }
  .note { border-left: 4px solid var(--accent); background: #fff; padding: 10px 14px; margin: 12px 0; }
  .warn { border-left-color: #b4432f; }
  label { display: block; margin: 12px 0 4px; }
  input { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; width: 100%; }
  code, pre { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  pre { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px; white-space: pre-wrap; word-break: break-all; }
  footer { max-width: 880px; margin: 24px auto; padding: 0 16px; color: var(--muted); font-size: 13px; }
  .overlay { position: fixed; inset: 0; background: rgba(20, 24, 28, .58); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .overlay .box { background: #fff; max-width: 480px; border-radius: 10px; padding: 24px; }
  @media (max-width: 600px) { header { padding: 10px 16px; gap: 10px; } nav a { margin-right: 10px; } }
</style>
</head>
<body>
  <header class="slim"><span class="brand">Almadía Hogar</span></header>
  <main class="bare">
    <div class="card">
      <h1>Inicia sesión para ver tus pedidos</h1>
      <p>Tu sesión ha caducado. Vuelve a entrar para consultar el historial y el estado de tus pedidos.</p>
      <label for="em">Correo electrónico</label>
      <input id="em" type="email" autocomplete="username">
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password">
      <p><button class="btn">Iniciar sesión</button></p>
      <p><a href="#">¿Has olvidado tu contraseña?</a> · <a href="#">Crear una cuenta</a></p>
    </div>
    <p class="muted">Atención al cliente: +34 910 000 145 · ayuda@almadia-hogar.example</p>
  </main>
  <footer>© 2026 Almadía Hogar</footer>
</body>
</html>
